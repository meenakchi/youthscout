name: Run Opportunity Scraper

on:
  schedule:
    - cron: '0 9 * * 1,4'   # Every Monday and Thursday at 9am UTC (5pm SGT)
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config --global user.name "opportunity-bot"
          git config --global user.email "bot@noreply.github.com"
          git add data/opportunities.json
          git diff --staged --quiet || git commit -m "chore: update opportunities $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}